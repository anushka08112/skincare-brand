{% extends "base.html" %}

{% block content %}

<div class="min-h-[85vh] flex items-center justify-center bg-gradient-to-br from-red-50 to-white px-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-10">

        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
            Create Account
        </h1>

        <form method="POST" class="space-y-5">

            <input 
                name="name"
                type="text"
                placeholder="Enter Name"
                required
                class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-red-400"
            >

            <input 
                name="email"
                type="email"
                placeholder="Enter Email"
                required
                class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-red-400"
            >

            <input 
                name="password"
                type="password"
                placeholder="Enter Password"
                required
                class="w-full border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-red-400"
            >

            <button 
                type="submit"
                class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-2xl font-semibold text-lg transition duration-300 shadow-md"
            >
                Register
            </button>

        </form>

        <div class="text-center text-gray-600 mt-6">

            Already have an account?

            <a 
                href="{{ url_for('login') }}"
                class="text-red-600 hover:text-red-700 font-semibold ml-1"
            >
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
