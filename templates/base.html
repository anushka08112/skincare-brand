<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900">

<nav class="sticky top-0 z-50 bg-red-600 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3">

        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">

            <h2 class="text-2xl font-bold text-white">
                <a href="/dashboard">GlowCare</a>
            </h2>

            <div class="flex flex-col sm:flex-row gap-3 text-white text-sm">

                <div class="relative">
                    <button onclick="toggleDropdown('concernMenu')" class="bg-red-700 px-4 py-2 rounded-lg">
                        Shop by Concern <i class="bi bi-caret-down"></i>
                    </button>

                   <div id="concernMenu" class="hidden absolute sm:top-11 left-0 bg-white text-gray-800 rounded-xl shadow-lg min-w-56 overflow-hidden z-50">
                        {% for c in concerns %}
                            <a href="{{ url_for('filter_concern', name=c[1]) }}"
                            class="block px-4 py-2 hover:bg-gray-100">
                                {{ c[1] }}
                            </a>
                        {% endfor %}
                </div>
                </div>

                <div class="relative">
                    <button onclick="toggleDropdown('ingredientMenu')" class="bg-red-700 px-4 py-2 rounded-lg">
                        Shop by Ingredient <i class="bi bi-caret-down"></i>
                    </button>

                    <div id="ingredientMenu" class="hidden absolute sm:top-11 left-0 bg-white text-gray-800 rounded-xl shadow-lg min-w-56 overflow-hidden z-50">
                            {% for i in ingredients %}
                                <a href="{{ url_for('filter_ingredient', name=i[1]) }}"
                                class="block px-4 py-2 hover:bg-gray-100">
                                    {{ i[1] }}
                                </a>
                            {% endfor %}
                    </div>
                </div>

            </div>

            <form method="GET" action="/search" class="w-full lg:w-64">
                <input 
                    type="text" 
                    name="q" 
                    placeholder="Search products..."
                    class="w-full px-4 py-2 rounded-full outline-none"
                >
            </form>

            <div class="grid grid-cols-2 sm:flex gap-2 text-white text-sm">
                <a class="bg-red-700 px-3 py-2 rounded-lg text-center" href="/about">About</a>
                <a class="bg-red-700 px-3 py-2 rounded-lg text-center" href="/cart">Cart <i class="bi bi-cart-dash"></i>(<span id="cart-count"></span>)</a>
                <a class="bg-red-700 px-3 py-2 rounded-lg text-center" href="/orders">Orders <i class="bi bi-box-seam"></i></a>
                <a class="bg-red-700 px-3 py-2 rounded-lg text-center" href="/profile">Profile <i class="bi bi-person-circle"></i></a>

                {% if session.get("user_id") == 1 %}
                <a class="bg-red-800 px-3 py-2 rounded-lg text-center" href="/admin">Admin <i class="bi bi-gear"></i></a>
                {% endif %}
            </div>

        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<script>
function toggleDropdown(id) {
    const menu = document.getElementById(id);
    menu.classList.toggle("hidden");
}

function addToCart(productId, button) {
    fetch("/api/cart/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ product_id: productId })
    })
    .then(res => res.json())
    .then(data => {
        loadCartCount();
        alert("Added to cart ✅");
    })
    .catch(err => console.log("Error:", err));
}

function loadCartCount() {
    fetch("/api/cart")
    .then(res => res.json())
    .then(data => {
        const count = document.getElementById("cart-count");
        if (count) count.innerText = data.length;
    });
}

function toggleWishlist(productId, btn) {
    fetch("/api/wishlist/toggle", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ product_id: productId })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "added") {
            btn.innerText = "❤️";
        } else {
            btn.innerText = "🤍";
        }
    });
}

loadCartCount();
</script>

</body>
</html>
