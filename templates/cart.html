{% extends "base.html" %}

{% block content %}
<h1>Your Cart</h1>

<div id="cart-container"></div>

<h3>Total: ₹<span id="total">0</span></h3>

<button type="button"  onclick="checkout()">Checkout</button>

<script>

// LOAD CART (ONLY ONE FUNCTION)
function loadCart() {
    fetch("/api/cart")
    .then(res => res.json())
    .then(data => {

        let html = "";
        let total = 0;

        if (data.length === 0) {
            document.getElementById("cart-container").innerHTML = "<p>Cart is empty</p>";
            document.getElementById("total").innerText = 0;
            return;
        }

        data.forEach(item => {
            total += item.price * item.quantity;

            html += `
                <div style="border:1px solid #ddd; padding:10px; margin:10px;">
                    <img src="/static/images/${item.image}" width="80">
                    <h3>${item.name}</h3>
                    <p>₹${item.price}</p>

                    <button onclick="updateQty(${item.cart_id}, ${item.quantity - 1})">-</button>
                    ${item.quantity}
                    <button onclick="updateQty(${item.cart_id}, ${item.quantity + 1})">+</button>

                    <br><br>
                    <button onclick="removeItem(${item.cart_id})">Remove</button>
                </div>
            `;
        });

        document.getElementById("cart-container").innerHTML = html;
        document.getElementById("total").innerText = total;
    });
}


// UPDATE QUANTITY
function updateQty(id, qty) {
    fetch("/api/cart/update", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            cart_id: id,
            quantity: qty
        })
    })
    .then(() => {
        loadCart();
        loadCartCount(); // navbar update
    });
}


// REMOVE ITEM
function removeItem(id) {
    updateQty(id, 0); // delete via backend
}


function checkout() {
    fetch("/api/checkout", {
        method: "POST",
        credentials: "same-origin"
    })
    .then(res => res.json())
    .then(data => {

        if (data.error) {
            alert(data.error);
            return;
        }

        window.location.href = "/success/" + data.order_id;
    })
    .catch(err => console.log(err));
}
// INITIAL LOAD
loadCart();

</script>

{% endblock %}
