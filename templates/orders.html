{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-50 py-10 px-4">

    <div class="max-w-5xl mx-auto">

        <h1 class="text-4xl font-bold text-gray-800 mb-10 text-center">
            Your Orders
        </h1>

        <div 
            id="orders-container"
            class="space-y-8"
        ></div>

    </div>

</div>

<script>

fetch("/orders-data")
.then(res => res.json())
.then(data => renderOrders(data));

function renderOrders(orders) {

    let html = "";

    if (orders.length === 0) {

        html = `
            <div class="bg-white rounded-3xl shadow-md p-12 text-center text-gray-500 text-xl">
                No orders yet
            </div>
        `;

        document.getElementById("orders-container").innerHTML = html;
        return;
    }

    orders.forEach(order => {

        let statusClass = order.status.replaceAll(" ", "");

        html += `
            <div class="bg-white rounded-3xl shadow-lg p-6">

                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b pb-5">

                    <div>

                        <div class="text-2xl font-bold text-gray-800">
                            Order #${order.order_id}
                        </div>

                        <div class="text-red-600 font-semibold text-lg mt-1">
                            ₹${order.total}
                        </div>

                    </div>

                    <div class="px-5 py-2 rounded-full text-sm font-semibold bg-red-100 text-red-600 w-fit">
                        ${order.status}
                    </div>

                </div>

                <div 
                    class="mt-6 space-y-4"
                    id="items-${order.order_id}"
                >

                    Loading items...

                </div>

            </div>
        `;
    });

    document.getElementById("orders-container").innerHTML = html;

    orders.forEach(order => {
        loadItems(order.order_id);
    });
}

function loadItems(orderId) {

    fetch("/api/order-items/" + orderId)

    .then(res => res.json())

    .then(items => {

        let html = "";

        items.forEach(item => {

            html += `
                <div class="flex items-center gap-5 bg-gray-50 rounded-2xl p-4">

                    <img 
                        src="/static/images/${item.image}"
                        class="w-24 h-24 object-cover rounded-2xl shadow"
                    >

                    <div class="flex-1">

                        <div class="text-xl font-semibold text-gray-800 mb-2">
                            ${item.name}
                        </div>

                        <p class="text-gray-600">
                            Quantity: ${item.quantity}
                        </p>

                        <p class="text-red-600 font-semibold mt-1">
                            Price: ₹${item.price}
                        </p>

                    </div>

                </div>
            `;
        });

        document.getElementById(
            "items-" + orderId
        ).innerHTML = html;
    });
}

</script>

{% endblock %}
